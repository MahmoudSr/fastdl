# Builds the Windows and macOS apps on GitHub's machines and attaches them, plus the
# browser extension, to a draft release. Run it by pushing a version tag:
#   git tag v0.1.0 && git push origin v0.1.0
# Then review the draft on GitHub and publish it.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --bundles nsis
          - os: macos-latest
            args: --target universal-apple-darwin --bundles dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Run unit tests
        working-directory: app/src-tauri
        run: cargo test --lib

      - name: Test the extension against the app's endpoint (end to end)
        if: matrix.os == 'windows-latest'
        run: node test/extension-test.js

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: fastdl ${{ github.ref_name }}
          releaseBody: |
            **Windows:** download `fastdl_*_x64-setup.exe` and run it. It isn't code-signed yet, so Windows may say "Windows protected your PC". Click **More info → Run anyway**.
            **Windows, portable:** download `fastdl_*_x64-portable.zip` and unzip it anywhere, a USB stick too. Settings stay in the `data` folder next to `fastdl.exe`, nothing goes to AppData.
            **Mac:** download the `.dmg`. It isn't notarized yet, so right-click the app and choose **Open** the first time.

            **Browser extension**
            - **Ungoogled Chromium and other Chromium builds:** download `fastdl-extension.crx`, open `chrome://extensions`, turn on **Developer mode** and drag the file onto the page.
            - **Chrome, Edge, and any browser that refuses the .crx:** download `fastdl-extension.zip` and unzip it. Open `chrome://extensions`, turn on **Developer mode**, click **Load unpacked** and pick the folder. (Chrome and Edge only accept .crx files from their own stores.)
            - Then click the fastdl extension icon → **Connect**, and click **Allow** in fastdl.
          releaseDraft: true
          args: ${{ matrix.args }}

      - name: Attach the portable build
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $dir = New-Item -ItemType Directory -Force portable/fastdl
          Copy-Item app/src-tauri/target/release/fastdl.exe, app/portable/fastdl.ini $dir
          $zip = "fastdl_${version}_x64-portable.zip"
          Compress-Archive -Path $dir -DestinationPath $zip
          gh release upload "${{ github.ref_name }}" $zip --clobber

  # The .crx must be signed with the extension's original private key, or its ID changes and the
  # app refuses it. The key lives only in the EXTENSION_PEM secret (Settings → Secrets and variables
  # → Actions), never in the repository. The packer checks the key matches manifest.json "key" and
  # bridge.rs, and verifies the .crx it writes, so a wrong key fails the job instead of shipping.
  extension:
    needs: app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test the extension packer
        run: node test/pack-extension-test.js

      - name: Build the extension zip and signed .crx
        env:
          FASTDL_EXTENSION_PEM: ${{ secrets.EXTENSION_PEM }}
        run: |
          if [ -n "$FASTDL_EXTENSION_PEM" ]; then
            node scripts/pack-extension.js --out dist --require-key
            node scripts/pack-extension.js --verify dist/fastdl-extension.crx
          else
            echo "::warning::The EXTENSION_PEM secret isn't set, so this release has no signed .crx (zip only)."
            node scripts/pack-extension.js --out dist
          fi

      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" dist/* --clobber
