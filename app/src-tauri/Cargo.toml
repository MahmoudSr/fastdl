[package]
name = "fastdl"
version = "0.1.0"
description = "Fast multi-connection download manager"
edition = "2021"

[lib]
name = "fastdl_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
tokio-util = "0.7"
# HTTP/1.1 only on purpose: each range request must get its own TCP connection.
# native-tls = Windows' built-in TLS (SChannel), keeps the binary small.
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "stream"] }
futures-util = { version = "0.3", default-features = false }
# Pairing with the browser extension (HMAC-SHA256 + a random key).
hmac = "0.12"
sha2 = "0.10"
getrandom = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
