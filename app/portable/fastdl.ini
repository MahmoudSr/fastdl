; fastdl portable mode
;
; While this file sits next to fastdl.exe, fastdl keeps everything (settings, the download list,
; the browser-extension key and its window data) in the "data" folder next to fastdl.exe, and
; writes nothing to AppData. Move the whole folder and your settings move with it.
;
; Delete this file to go back to normal mode (data in %APPDATA%\com.fastdl.desktop).
